# ============================================================================
# 风险维度归类别名表（确定性降级依据）
#
# 用途：维度归类节点的模型不可用 / 输出越界时，用本表把「旧事件类别 + 事件子类型 + 来源」
# 确定性归入新的六大风险维度，保证链路不中断、报告始终可生成。
#
# 新维度（固定六项，不得增减）：
#   公司背景 / 司法 / 失信 / 经营风险 / 经营状况 / 知识产权
#
# 说明：
# - 归类由模型优先完成（语义归类），本表只在**模型不可用/越界**时兜底；
# - 别名表按本地数据真实子类型枚举（见 data/source/risk_events.csv），未命中的
#   按「旧类别 -> 新维度」的 category_rules 归并；
# - 模型返回合法归类的维度以模型为准，本表仅补齐缺失条目；
# - `subtype_rules` 优先于 `category_rules`（子类型比类别更具体）；
# - 未命中任何规则的维度统一回退到 `fallback_dimension`。
# ============================================================================

fallback_dimension: 经营风险

# 旧事件类别 -> 新维度
category_rules:
  经营: 经营风险
  合规: 经营风险
  履约: 经营状况
  人员: 经营状况
  安全: 经营状况
  舆情: 公司背景
  知识产权: 知识产权
  失信: 失信
  司法: 司法

# 事件子类型关键词 -> 新维度（含关键词即命中，按声明顺序取第一个命中）
subtype_rules:
  # 失信：严重违法失信 / 失信被执行
  - keywords: ["失信", "被执行人", "老赖"]
    dimension: 失信
  # 司法：诉讼 / 法院公告
  - keywords: ["诉讼", "仲裁", "判决", "法院", "立案", "开庭"]
    dimension: 司法
  # 知识产权：专利 / 商标 / 著作权许可与权属纠纷
  - keywords: ["专利", "商标", "著作权", "知识产权", "侵权", "许可纠纷", "权属纠纷"]
    dimension: 知识产权
  # 公司背景：股东 / 股权 / 经营异常名录
  - keywords: ["股东", "股权", "实际控制人", "注册资本", "工商", "经营异常"]
    dimension: 公司背景
  # 公司背景：负面舆情 / 投诉曝光
  - keywords: ["舆情", "负面", "曝光", "投诉"]
    dimension: 公司背景

# 数据来源 -> 新维度（仅当上面都未命中时使用）
source_rules:
  法院公告: 司法
  执行信息: 失信
  知识产权局: 知识产权
  工商登记: 公司背景
  监管机构: 经营风险
