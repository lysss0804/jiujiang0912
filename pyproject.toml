[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jiujiang-vendor-risk-agents"
version = "0.2.0"
description = "银行外包供应商当前风险分级与 Multi-Agent 协同分析服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "openai>=1.40,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
]
docs = [
  "python-docx>=1.1,<2",
  "pypdf>=4,<7",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
]

[project.scripts]
jiujiang = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
